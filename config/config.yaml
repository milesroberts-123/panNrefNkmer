
# Split sites for genotype calling into N lists for parallelization =========================

splits: 40

# kmc parameters ============================================================================

## k-mer length
k: 31

## minimum k-mer count for kmc3
mincount: 5

## maximum k-mer count for kmc3
maxcount: 100000

## size of counting bloom filter array
array_size: 500000

## number of hash functions
num_hash: 4

## number of k-mer hits that a read needs to have to determine contamination
contam_match_limit_count: 2

## number of k-mers to randomly subset from large table for distance metrics
num_kmers_kept: 10000000

## number of samples per group when pasting k-mer tables in parallel
paste_group_size: 100

# kraken2 parameters =========================================================================

## path to kraken2 microbial database
kraken_db_path: "/path/to/kraken2/microbial/db"

## kraken2 confidence threshold (0.0 = no filtering by confidence)
kraken_confidence: 0.0

# fastp parameters ==========================================================================

## unqualified_percent_limit for fastp: how many percents of bases are allowed to be unqualified in terms of quality score
unqualLimit: 40

## quality score for read trimming
qualThresh: 30

## window length for read trimming
windowLength: 1

## maximum number of N bases allowed per read
nBaseLimit: 5

# contaminants to include in read QC =========================================================

## contaminants to download from ncbi
ncbi_contams:
 - "human"

## custom contaminants, user provides fasta file
custom_contams:

# --- PSMC pipeline ------------------------------------------------------------------------------------------------------
# Confirmed correct on Savio: {species}/{species}.fasta + bwa index files
# # already present here (e.g. Erythroxylum_citrifolium/Erythroxylum_citrifolium.fasta{,.amb,.ann,.bwt,.pac,.sa,.fai}).
reference_genome_path: "/global/scratch/projects/fc_moilab/julesperez/post_rot/new_refgenomes/"
#reference_genome_path: "../config/jules_ref_genomes/"

# TruSeq3-PE-2.fa (not TruSeq3-PE.fa), matching your actual established
# gatk_pipeline script -- referenced in place under post_rot/software/triM/,
# same legitimately-organized shared-software category as psmc_path below,
# not the incidental NCBI-download location we initially copied from.
# (resources/adapters/TruSeq3-PE.fa from that earlier copy is now unused --
# harmless leftover, safe to delete whenever.)
adapter_path: "/global/scratch/projects/fc_moilab/julesperez/post_rot/software/triM/Trimmomatic/adapters/TruSeq3-PE-2.fa"
#adapter_path: "../config/trimmomatic_adapters.fa"

# Referenced in place (not copied) -- lives in post_rot/software/ alongside
# GATK, msmc-tools, smc++, stairway_plot, etc., a deliberately organized
# shared-software directory, same category as reference_genome_path above.
psmc_path: "/global/scratch/projects/fc_moilab/julesperez/post_rot/software/psmc/psmc"

# # --- bcftools mpileup quality filters: inherited convention, not newly ---
# # --- tested in this investigation -- matches q=20/Q=20 used elsewhere  ---
# # --- in this project's other joint-calling scripts.                    ---
q: 20   # minimum mapping quality (mpileup -q)
Q: 20   # minimum base quality (mpileup -Q)


# --- ROH parameters: VALIDATED in the AB-masking/AF-dflt investigation ---
G: 30        # bcftools roh -G, genotype quality threshold
AFdflt: 0.10 # bcftools roh --AF-dflt, empirically best across 9 species/3 mating systems

# --- Globus backup ---
# Endpoints pulled from your existing globus_verify_delete.sh /
# globus_transfer_missing.sh scripts (SCRIPTS/ on Savio) -- same Savio
# source and moilab-glacier-transfer destination those already use.
globus_src_endpoint: "d8539a62-821f-477d-a592-43b2af60ab28"
globus_dst_endpoint: "5f952031-43e3-4d43-8c46-3ac29b1d4c28"

# Deliberately a NEW bucket, not the old SPECIES_COMPLETED_BATCH_2 -- this
# pipeline's output naming (results/mark_reads/{srr}.bam, no .dedup.bam
# suffix, no mapped/ subfolder) doesn't match what the old GOAT-pipeline
# verify/retry/delete scripts expect under BATCH_2, so keeping it separate
# avoids those scripts scanning files they don't recognize.
